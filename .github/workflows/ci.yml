name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The package needs Swift 6.4 tools and the OS 27 SDKs, and its tests run on macOS 27. GitHub's
# only image with those is the `xcode-27` preview; `macos-26` stops at Xcode 26 and Swift 6.3.
# Move to `macos-27` once that label exists.
jobs:
  check:
    name: Lint and test on macOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: jdx/mise-action@v3
      - run: mise run check

  ios:
    name: Test on the iOS Simulator
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: jdx/mise-action@v3
      - run: mise run test:ios

  platforms:
    name: Build for iOS, tvOS, visionOS and Mac Catalyst
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: jdx/mise-action@v3
      - run: mise run build:platforms
